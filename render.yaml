# Free Render stack: one web service also runs the tournament tick.
# Postgres on the free plan expires 30 days after creation.
services:
  - type: web
    name: dota2-cup
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npx prisma generate && NODE_OPTIONS=--max-old-space-size=2048 npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NEXT_PUBLIC_APP_NAME
        value: Aegis Arena
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: ru
      - key: NEXT_PUBLIC_SUPPORTED_LOCALES
        value: ru,en
      - key: DISABLE_TOURNAMENT_TICK
        value: "0"
      - key: TOURNAMENT_TICK_MS
        value: "60000"
      - key: LOG_LEVEL
        value: info
      - key: STEAM_API_KEY
        sync: false
      - key: LOCAL_MEDIA_DIR
        value: /tmp/aegis-media
      - key: DATABASE_URL
        fromDatabase:
          name: dota2-cup-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: dota2-cup-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dota2-cup-redis
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DOTA_GC_INTERNAL_TOKEN
        generateValue: true
  - type: keyvalue
    name: dota2-cup-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: dota2-cup-db
    plan: free
    region: singapore
    databaseName: mediagame
    user: aegis
    postgresMajorVersion: "16"
    ipAllowList: []

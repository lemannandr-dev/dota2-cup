# Deprecated. Use docker-compose.second.yml (web :3002, postgres :5434, realtime :3003, tick2).
version: "3.9"

services:
  web2:
    build: .
    container_name: media-game-cup-web-2
    ports:
      - "3001:3000"
    env_file:
      - .env
    depends_on:
      - postgres2
      - redis2
      - minio2
    volumes:
      - .:/app
    command: ["sh", "-c", "npm run prisma:migrate && npm run dev"]

  postgres2:
    image: postgres:15
    container_name: media-game-cup-postgres-2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediagame
    ports:
      - "5433:5432"
    volumes:
      - pgdata2:/var/lib/postgresql/data

  redis2:
    image: redis:7
    container_name: media-game-cup-redis-2
    ports:
      - "6380:6379"

  minio2:
    image: minio/minio
    container_name: media-game-cup-minio-2
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9101"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data2:/data

volumes:
  pgdata2:
  minio-data2:

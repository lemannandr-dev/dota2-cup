# Production stack: image build only, no source bind-mount.
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOCAL_MEDIA_DIR: /app/.data/media
    volumes:
      - appearance-media:/app/.data/media
    depends_on:
      - postgres
      - redis
    command: ["sh", "-c", "npm run env:check && npx prisma migrate deploy && npm run start"]

  realtime:
    build: .
    env_file:
      - .env
    environment:
      REALTIME_PORT: 3003
    command: ["npx", "tsx", "scripts/realtime-server.ts"]
    ports:
      - "3003:3003"
    depends_on:
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  pgdata:
  appearance-media:

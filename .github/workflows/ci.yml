name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run env:check
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5544/aegis_test?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5544/aegis_test?schema=public
          AUTH_SECRET: ci-test-secret-change-me-32-characters
          DOTA_GC_INTERNAL_TOKEN: ci-test-gc-token-change-me-32-characters
          REDIS_URL: redis://localhost:6581
          NEXT_PUBLIC_APP_NAME: Aegis Arena Test
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint

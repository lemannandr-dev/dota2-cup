<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#091014">
    <meta name="robots" content="noindex">
    <title>Нет соединения | Aegis Arena</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #091014; color: #e8eeec; font: 16px/1.5 system-ui, sans-serif; }
        main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; width: min(100%, 440px); margin: auto; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
        img { display: block; width: 72px; height: 72px; margin-bottom: 16px; }
        .brand { margin: 0 0 32px; font-size: 18px; font-weight: 600; }
        h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; overflow-wrap: anywhere; }
        p { margin: 0 0 24px; color: #a5b5ba; }
        a { min-height: 52px; display: flex; align-items: center; justify-content: center; padding: 12px 16px; border-radius: 8px; background: #bce8d2; color: #10271b; font-weight: 600; text-decoration: none; text-align: center; }
        a:focus-visible { outline: 3px solid #f0c86e; outline-offset: 4px; }
        a:active { background: #9eddbb; }
        .home { margin-top: 12px; border: 1px solid #43525a; color: #e8eeec; background: transparent; }
        .home:active { background: #19282d; }
    </style>
</head>
<body>
    <main aria-labelledby="offline-title">
        <img src="/icons/aegis-arena-48.png" width="72" height="72" alt="">
        <p class="brand">AEGIS ARENA</p>
        <h1 id="offline-title">Нет соединения</h1>
        <p>Проверьте интернет и повторите попытку. Пока сеть недоступна, изменения не отправляются.</p>
        <a href="">Повторить</a>
        <a class="home" href="/home">На главную</a>
    </main>
</body>
</html>
